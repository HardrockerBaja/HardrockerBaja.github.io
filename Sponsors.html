<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <base href="https://baja.hardrocker.racing/" />
  <link rel="canonical" href="https://baja.hardrocker.racing/" />
  <title>Sponsors</title>

  <script type="module" src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.4.0/dist/shoelace.js"></script>
  <script type="module">
    import { setBasePath } from 'https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.4.0/dist/utilities/base-path.js';
    setBasePath('https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.4.0/dist');
  </script>

  <link rel="stylesheet" href="https://hardrocker.racing/master.css" />
 <link rel="stylesheet" href="baja-overrides.css" />
  <script src="baja-favicon.js"></script>

  <style>
    /* All tiers stacked vertically, centered */
    #sponsors {
      max-width: 5000px;   /* the box; adjust to taste */
      margin: 0 auto;      /* keeps it centered */
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
      width: 100%;
    }

    .logo-text {
      display: inline-block;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      text-align: center;
      line-height: 1.1;
      color: #ffffff;
    }

    /* One row per tier; wraps when there are many logos or on small screens */
    .sponsor-tier {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 20px 40px;
    }

    /* Tier 1 sponsors each get their own row */
    .sponsor-tier.tier-1 {
      flex-direction: column;
      gap: 40px;
    }

    .sponsor-tier img {
      max-width: 100%;   /* keeps big logos from overflowing on phones */
      height: auto;
    }

    /* Logo with text beside it (used when a sponsor has a blurb) */
    .sponsor-feature {
      display: flex;
      flex-wrap: wrap;           /* text drops below the logo on narrow screens */
      justify-content: center;
      align-items: center;
      gap: 20px 40px;
      max-width: 1000px;
    }

    .hero .sponsor-blurb {
      flex: 1 1 280px;
      margin: 0;
      text-align: left;
    }
  </style>
</head>
<body>

  <div id="navbar-placeholder"></div>

  <script>
    fetch('navbar-baja.html')
      .then(response => {
        if (!response.ok) throw new Error('Navbar load failed');
        return response.text();
      })
      .then(html => {
        const navFragment = document.createRange().createContextualFragment(html);
        const placeholder = document.getElementById('navbar-placeholder');

        placeholder.innerHTML = '';
        placeholder.appendChild(navFragment);
      })
      .catch(error => {
        console.warn(error);
        document.getElementById('navbar-placeholder').innerHTML =
          '<div style="padding: 1rem; text-align: center; background: #222; color: #f9d56e;">Navigation failed to load. <a href="/" style="color: white;">Go to Home</a></div>';
      });
  </script>

  <main>
    <section class="hero">
      <div class="hero-content">
        <h1>Our Sponsors Make This Possible</h1>
        <p>We value each and every sponsor, past and present, who supports our team and helps us grow as engineers outside of the classroom.</p>
      </div>

      <!-- Sponsor logos are built from the list in the script below -->
      <div id="sponsors"></div>
      <noscript>
        <p>Please enable JavaScript to see our sponsor logos.</p>
      </noscript>
    </section>
  </main>

  <script>
    /*
      Reference the current year's sponsorship tracking spreadsheet for tier levels.

      To add a sponsor, add one line to this list:
        name  : used for the image's alt text (accessibility)
        tier  : 1 (largest) through 4 (smallest)
        logo  : path to the image file
        url   : optional; makes the logo a link to the sponsor's website
        blurb : optional; shows this text beside the logo
    */
    const sponsors = [

      {
        name: "KISSsoft",
        tier: 1,
        logo: "Images/Sponsor Logos/Teir 1/kisssoft_logo_grey_rgb.png",
        url: "https://www.kisssoft.com/",
        blurb: "KISSsoft provides the tools nessesary for us to develop and itterate uppon our drivetrain, allowing us to design and model gears and shafts and perform complex analysis on them."
      },

      {
        name: "Solidworks",
        tier: 1,
        logo: "Images/Sponsor Logos/Teir 1/SolidworksBW.png",
        url: "https://www.solidworks.com/",
        blurb: "SolidWorks provides industry-leading 3D cad software where we can model and simulate complex components, bringing our ideas into reality."
      },

    {
      name: "Michigan Scientific",
      tier: 2,
      logo: "Images/Sponsor Logos/Teir 1/Michigan Scientific.png",
      url: "https://www.michsci.com/"
    },

      { name: "3Dconnexion", tier: 3, logo: "Images/Sponsor Logos/Teir 3/3dconnexion.svg", url: "https://www.3dconnexion.com/" },
      { name: "Harvey Lawncare", tier: 3 },
    ];

// Logo box and text size for each tier (px)
  const tierSizes = {
    1: { w: 400, h: 160, font: 64 },
    2: { w: 300, h: 120, font: 48 },
    3: { w: 200, h: 80,  font: 32 },
    4: { w: 100, h: 40,  font: 18 },
  };

  const logoRoot = "Images/Sponsor Logos/";
  const logoPath = s => s.logo.includes('/') ? s.logo : `${logoRoot}Teir ${s.tier}/${s.logo}`;

  // The sponsor's name styled as a logo
  function makeText(s) {
    const { w, font } = tierSizes[s.tier];
    const span = document.createElement('span');
    span.className = 'logo-text';
    span.textContent = s.name;
    span.style.fontSize = font + 'px';
    span.style.maxWidth = w + 'px';
    return span;
  }

  // The sponsor's image, falling back to text if it can't load
  function makeImage(s) {
    const { w, h } = tierSizes[s.tier];
    const img = document.createElement('img');
    img.src = logoPath(s);
    img.alt = s.name;
    img.loading = 'lazy';
    img.style.width = w + 'px';
    img.style.height = h + 'px';
    img.style.objectFit = 'contain';
    img.onerror = () => {
      console.warn(`Logo for "${s.name}" failed to load (${img.src}). Showing its name instead.`);
      img.replaceWith(makeText(s));
    };
    return img;
  }

  // Catch typos like "teir: 1" instead of letting the sponsor silently vanish
  sponsors
    .filter(s => !tierSizes[s.tier])
    .forEach(s => console.warn(`Sponsor "${s.name}" has no valid tier (1-4), so it won't be shown.`));

  const root = document.getElementById('sponsors');

  [1, 2, 3, 4].forEach(tier => {
    const group = sponsors.filter(s => s.tier === tier);
    if (!group.length) return;

    const row = document.createElement('div');
    row.className = 'sponsor-tier tier-' + tier;

    group.forEach(s => {
      let el = s.logo ? makeImage(s) : makeText(s);

      if (s.url) {
        const link = document.createElement('a');
        link.href = s.url;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.appendChild(el);
        el = link;
      }

      if (s.blurb) {
        const feature = document.createElement('div');
        feature.className = 'sponsor-feature';

        const text = document.createElement('p');
        text.className = 'sponsor-blurb';
        text.textContent = s.blurb;

        feature.appendChild(el);
        feature.appendChild(text);
        el = feature;
      }

      row.appendChild(el);
    });

    root.appendChild(row);
  });
</script>

</body>
</html>
