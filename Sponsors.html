<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <base href="https://baja.hardrocker.racing/" />
  <link rel="canonical" href="https://baja.hardrocker.racing/" />
  <title>Sponsors</title>
  
  <script type="module" src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.4.0/dist/shoelace.js"></script>
  <script type="module">
    import { setBasePath } from 'https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.4.0/dist/utilities/base-path.js';
    setBasePath('https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.4.0/dist');
  </script>
  
  <link rel="stylesheet" href="https://hardrocker.racing/master.css" />
  <link rel="stylesheet" href="baja-overrides.css" />
  <script src="baja-favicon.js"></script>
  <style>

    .container {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .row {
      display: flex;
      align-items: center; /* Vertically centers text next to the image */
      gap: 20px;           /* Space between image and text */
    }

    .teir1 {
      width: 400px;        /* Set your preferred image width */
    }

    .teir2 {
      width: 300px
    }

    .teir3 {
      width: 200px;        /* Set your preferred image width */
    }

    .teir4 {
      width: 100px
    }
  </style>
</head>
<body>
  
  <div id="navbar-placeholder"></div>
  
  <script>
    fetch('navbar-baja.html')
      .then(response => {
        if (!response.ok) throw new Error('Navbar load failed');
        return response.text();
      })
      .then(html => {
        const navFragment = document.createRange().createContextualFragment(html);
        const placeholder = document.getElementById('navbar-placeholder');
        
        placeholder.innerHTML = '';
        placeholder.appendChild(navFragment);
      })
      .catch(error => {
        console.warn(error);
        document.getElementById('navbar-placeholder').innerHTML = 
          '<div style="padding: 1rem; text-align: center; background: #222; color: #f9d56e;">Navigation failed to load. <a href="/" style="color: white;">Go to Home</a></div>';
      });
  </script>
  
  <main>
    <section class="hero">
      <div class="hero-content">
        <h1>Our Sponsors Make This Possible</h1>
        <p>We value each and every sponsor, past and present, who supports our team and helps us grow as engineers outside of the classroom.</p>
      </div>

      <div class="container">
        <div class = "row">
          <a href="https://www.3dconnexion.com/">
            <img src="Images/Sponsor Logos/Teir 2/3dconnexion.png" alt="Sponsor image" class = "teir2">
          </a>
          <p>3Dconnexion provided the team with SpaceMouse Wireless for smoother workflows in solidworks this year</p>
        </div>
        <div class = "row">
          <img src="Images/Sponsor Logos/Teir 1/kisssoft_logo_grey_rgb.png" alt="Sponsor image" class = "teir1">
        </div>
      </div>
    </section>

  </main>
</body>
</html>
  </main>
</body>
</html>
