<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <base href="https://baja.hardrocker.racing/" />
  <link rel="canonical" href="https://baja.hardrocker.racing/" />
  <title>Baja</title>
  
  <script type="module" src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.4.0/dist/shoelace.js"></script>
  <script type="module">
    import { setBasePath } from 'https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.4.0/dist/utilities/base-path.js';
    setBasePath('https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.4.0/dist');
  </script>
  
  <link rel="stylesheet" href="https://hardrocker.racing/master.css" />
  <link rel="stylesheet" href="baja-overrides.css" />
  <script src="baja-favicon.js"></script>
</head>
<body style="background: linear-gradient(135deg, rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.35)), url('Images/DSC_7307.jpg') center center / cover no-repeat fixed;">
  
  <div id="navbar-placeholder"></div>
  
  <script>
    fetch('navbar-baja.html')
      .then(response => {
        if (!response.ok) throw new Error('Navbar load failed');
        return response.text();
      })
      .then(html => {
        /* FIX 2: Using createContextualFragment instead of innerHTML. 
          This safely injects the HTML AND ensures any <script> tags 
          inside your navbar-baja.html file will actually execute.
        */
        const navFragment = document.createRange().createContextualFragment(html);
        const placeholder = document.getElementById('navbar-placeholder');
        
        placeholder.innerHTML = ''; // Clear it out
        placeholder.appendChild(navFragment); // Inject the real nav
      })
      .catch(error => {
        console.warn(error);
        /* FIX 3: Give the user a fallback if the nav fails to load entirely */
        document.getElementById('navbar-placeholder').innerHTML = 
          '<div style="padding: 1rem; text-align: center; background: #222; color: #f9d56e;">Navigation failed to load. <a href="/" style="color: white;">Go to Home</a></div>';
      });
  </script>
  <main>
    <section class="hero">
      <div class="hero-content">
        <h1>Design, Build, Compete</h1>
        <h2>Feel free to contact us at baja@mines.sdsmt.edu</h2>
        <div class="button-group">
          <a class="primary" href="https://www.instagram.com/sdsmtbaja/">Instagram</a>
          <a class="secondary" href="https://www.linkedin.com/company/sdsmtbaja/">LinkedIn</a>
          <a class="primary" href="https://www.facebook.com/sdsmtbaja">Facebook</a>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
