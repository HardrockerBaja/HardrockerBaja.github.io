<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <base href="{{ BaseUrl }}" />
  <link rel="canonical" href="{{ CanonicalUrl }}" />
  <title>{{ PageTitle }}</title>
  
  <script type="module" src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.4.0/dist/shoelace.js"></script>
  <script type="module">
    import { setBasePath } from 'https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.4.0/dist/utilities/base-path.js';
    setBasePath('https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.4.0/dist');
  </script>
  
  <link rel="stylesheet" href="https://hardrocker.racing/master.css" />
  <link rel="stylesheet" href="baja-overrides.css" />
</head>
<body>
  <header class="navbar">
    <div class="brand">
      <a href="{{ BrandUrl }}">{{ TeamName }}</a>
    </div>
    <nav>
      <a href="https://hardrocker.racing/">Home</a>
      <a class="{{ ActiveClassBaja }}" href="https://baja.hardrocker.racing/">Baja</a>
      <a class="{{ ActiveClassFormula }}" href="https://formula.hardrocker.racing/">Formula</a>
    </nav>
  </header>
  
  <main>
    <section class="hero">
      <div class="hero-content">
        <h1>{{ HeroHeadline }}</h1>
        <p>{{ HeroDescription }}</p>
        <p>Feel free to reach out to us at {{ ContactEmail }}</p>
        
        <div class="button-group">
          <a class="primary" href="{{ PrimaryButtonUrl }}">{{ PrimaryButtonText }}</a>
          <a class="secondary" href="{{ SecondaryButtonUrl }}">{{ SecondaryButtonText }}</a>
        </div>
      </div>

      <div class="hero-card">
        <h2>{{ CardHeadline }}</h2>
        <p>{{ CardDescription }}</p>
      </div>
    </section>
  </main>
</body>
</html>
