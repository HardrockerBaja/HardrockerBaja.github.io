<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <base href="https://baja.hardrocker.racing/" />
  <link rel="canonical" href="https://baja.hardrocker.racing/" />
  <title>Leadership</title>
  
  <script type="module" src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.4.0/dist/shoelace.js"></script>
  <script type="module">
    import { setBasePath } from 'https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.4.0/dist/utilities/base-path.js';
    setBasePath('https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.4.0/dist');
  </script>
  
  <link rel="stylesheet" href="https://hardrocker.racing/master.css" />
  <link rel="stylesheet" href="baja-overrides.css" />
  <script src="baja-favicon.js"></script>
</head>
<body>
  
  <div id="navbar-placeholder"></div>
  
  <script>
    fetch('navbar-baja.html')
      .then(response => {
        if (!response.ok) throw new Error('Navbar load failed');
        return response.text();
      })
      .then(html => {
        const navFragment = document.createRange().createContextualFragment(html);
        const placeholder = document.getElementById('navbar-placeholder');
        
        placeholder.innerHTML = '';
        placeholder.appendChild(navFragment);
      })
      .catch(error => {
        console.warn(error);
        document.getElementById('navbar-placeholder').innerHTML = 
          '<div style="padding: 1rem; text-align: center; background: #222; color: #f9d56e;">Navigation failed to load. <a href="/" style="color: white;">Go to Home</a></div>';
      });
  </script>
  
  <main class="leadership-page">
    <section class="leadership-section" aria-labelledby="officers-heading">
      <h2 id="officers-heading" class="leadership-row-label">Officers</h2>
      <div class="leadership-row">
        <div class="headshot-slot" aria-label="Officer headshot slot 1"></div>
        <div class="headshot-slot" aria-label="Officer headshot slot 2"></div>
        <div class="headshot-slot" aria-label="Officer headshot slot 3"></div>
        <div class="headshot-slot" aria-label="Officer headshot slot 4"></div>
        <div class="headshot-slot" aria-label="Officer headshot slot 5"></div>
        <div class="headshot-slot" aria-label="Officer headshot slot 6"></div>
        <div class="headshot-slot" aria-label="Officer headshot slot 7"></div>
        <div class="headshot-slot" aria-label="Officer headshot slot 8"></div>
      </div>
    </section>

    <section class="leadership-section" aria-labelledby="design-leads-heading">
      <h2 id="design-leads-heading" class="leadership-row-label">Design Leads</h2>
      <div class="leadership-row">
        <div class="headshot-slot" aria-label="Design lead headshot slot 1"></div>
        <div class="headshot-slot" aria-label="Design lead headshot slot 2"></div>
        <div class="headshot-slot" aria-label="Design lead headshot slot 3"></div>
        <div class="headshot-slot" aria-label="Design lead headshot slot 4"></div>
        <div class="headshot-slot" aria-label="Design lead headshot slot 5"></div>
        <div class="headshot-slot" aria-label="Design lead headshot slot 6"></div>
        <div class="headshot-slot" aria-label="Design lead headshot slot 7"></div>
        <div class="headshot-slot" aria-label="Design lead headshot slot 8"></div>
      </div>
    </section>
  </main>
</body>
</html>
