<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <base href="https://baja.hardrocker.racing/" />
  <link rel="canonical" href="https://baja.hardrocker.racing/" />
  <title>{{ PageTitle }}</title>
  
  <script type="module" src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.4.0/dist/shoelace.js"></script>
  <script type="module">
    import { setBasePath } from 'https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.4.0/dist/utilities/base-path.js';
    setBasePath('https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.4.0/dist');
  </script>
  
  <link rel="stylesheet" href="https://hardrocker.racing/master.css" />
  <link rel="stylesheet" href="baja-overrides.css" />
</head>
<body>
  
  <div id="navbar-placeholder"></div>
  
  <script>
    fetch('navbar-baja.html')
      .then(response => {
        if (!response.ok) throw new Error('Navbar load failed');
        return response.text();
      })
      .then(html => {
        const navFragment = document.createRange().createContextualFragment(html);
        const placeholder = document.getElementById('navbar-placeholder');
        
        placeholder.innerHTML = '';
        placeholder.appendChild(navFragment);
      })
      .catch(error => {
        console.warn(error);
        document.getElementById('navbar-placeholder').innerHTML = 
          '<div style="padding: 1rem; text-align: center; background: #222; color: #f9d56e;">Navigation failed to load. <a href="/" style="color: white;">Go to Home</a></div>';
      });
  </script>
  
  <main>
    <section class="hero">
      <div class="hero-content">
        <h1>{{ HeroHeadline }}</h1>
        <p>{{ HeroDescription }}</p>
        <p>Feel free to reach out to us at {{ ContactEmail }}</p>
        
        <div class="button-group">
          <a class="primary" href="{{ PrimaryButtonUrl }}">{{ PrimaryButtonText }}</a>
          <a class="secondary" href="{{ SecondaryButtonUrl }}">{{ SecondaryButtonText }}</a>
        </div>
      </div>

      <div class="hero-card">
        <h2>{{ CardHeadline }}</h2>
        <p>{{ CardDescription }}</p>
      </div>
    </section>
  </main>
</body>
</html>
